
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
crate-type = ["rlib"]
proc-macro = false

[features]
input-api = ["structopt"]
blocking = []
# 从 etest.db 生成 verify.prod.bat 的独立小工具：只有该 bin 需要，库使用者不受影响
gen-cfg = ["dep:rusqlite"]
default = []

[dependencies]
strum = { version = "0.26", features = ["derive"] }
serde = "1"
serde_json = "1"
structopt = { version = "0.3", optional = true }
# e-utils: crates.io 0.4 的 AnyError = Box<dyn Error> 不 Send(同 etest)
e-utils = { path = "../e-utils", features = [
  "cmd",
  "fs",
  "parse",
  "regex",
  "base64",
] }
tokio = { version = "1", features = ["full"] }
# reqwest 0.13（2026-08 最新）：rust-version 需 ≥1.85（同步见 package.rust-version）
# TLS 用 rustls + ring（纯 Rust，无需系统 OpenSSL/CMake）：既保留 https（itapi/scm/mac 走 https://），
# 又让 cargo-zigbuild 交叉编译 Linux 不再依赖 openssl-sys（对齐 gpu-test 纯 Rust 跨平台）。
# 注：reqwest 的 rustls 默认走 aws-lc-rs（需 CMake），故用 rustls-no-provider + 直接依赖 rustls/ring 提供 provider。
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
md5 = "0.8"
# 仅 gen-cfg bin 使用；bundled = 静态编译 SQLite，现场电脑无需任何外部依赖/Python
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[[bin]]
name = "cvte-mes-gencfg"
path = "src/bin/gen_cfg.rs"
required-features = ["gen-cfg"]

[dev-dependencies]
cvte-mes = { path = "./", features = ["input-api"] }
e-utils = { path = "../e-utils", features = ["cmd", "fs"] }
e-log = { version = "0.4.2", features = ["log"] }

[package]
name = "cvte-mes"
version = "0.2.0-rc.1"
description = "源控MES系统接口"
authors = ["Eternal(梦游) <EternalNightYeah2@yeah.net>"]
edition = "2021"
# reqwest 0.13 要求 ≥1.85（同步升级，见 dependencies 注释）
rust-version = "1.85.0"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://gitee.com/eternalnight996/cvte-mes"
repository = "https://github.com/eternalnight996/cvte-mes"
categories = []
documentation = "https://docs.rs"
include = ["src/", "*.md", "LICENSE", "Cargo.toml", "COPYRIGHT"]
keywords = ["e-", "mes"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true

[patch.crates-io]
e-utils = { path = "../e-utils" }
e-log = { path = "../e-log" }
