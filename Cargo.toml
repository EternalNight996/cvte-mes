
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
crate-type = ["rlib"]
proc-macro = false

[features]
input-api = ["structopt"]
blocking = []
default = []

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
serde = "1"
serde_json = "1"
structopt = { version = "0.3", optional = true }
e-utils = { version = "0.4", features = [
  "cmd",
  "fs",
  "parse",
  "regex",
  "base64",
] }
tokio = { version = "1", features = ["full"] }
# reqwest 0.13（2026-08 最新）：rust-version 需 ≥1.85（同步见 package.rust-version）
# TLS 用 native-tls（系统 openssl：Ubuntu18.04 自带 1.1、Kylin V10 / UOS V20 自带），
# 避免 rustls-aws-lc（需 CMake≥3.12，Ubuntu18.04 仅 3.10 构建失败）—— 见 README「Linux 构建」
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
md5 = "0.8"

[dev-dependencies]
cvte-mes = { path = "./", features = ["input-api"] }
e-utils = { version = "0.4", features = ["cmd", "fs"] }
e-log = { version = "0.4.2", features = ["log"] }

[package]
name = "cvte-mes"
version = "0.1.0"
description = "源控MES系统接口"
authors = ["Eternal(梦游) <EternalNightYeah2@yeah.net>"]
edition = "2021"
# reqwest 0.13 要求 ≥1.85（同步升级，见 dependencies 注释）
rust-version = "1.85.0"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://gitee.com/eternalnight996"
categories = []
documentation = "https://docs.rs"
include = ["src/", "*.md", "LICENSE", "Cargo.toml", "COPYRIGHT"]
keywords = ["e-", "mes"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
