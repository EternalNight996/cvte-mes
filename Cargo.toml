
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
crate-type = ["rlib"]
proc-macro = false

[features]
input-api = ["structopt"]
default = []

[dependencies]
strum = { version = "0.26", features = ["derive"] }
serde = "1"
serde_json = "1"
structopt = { version = "0.3", optional = true }
e-utils = { version = "0.4", path = "../e-utils", features = [
  "cmd",
  "fs",
  "parse",
  "regex",
  "base64",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
md5 = "0.7"

[dev-dependencies]
cvte-mes = { path = "./", features = ["input-api"] }
e-utils = { version = "0.4", path = "../e-utils", features = ["cmd", "fs"] }
e-log = { version = "0.2", path = "../e-log", features = ["log"] }

[package]
name = "cvte-mes"
version = "0.1.0"
authors = [
  "Eternal Night <EternalNight996@gmail.com, EternalNightYeah2@yeah.net>",
]
edition = "2021"
rust-version = "1.80.0"
license-file = "E-LICENSE"
homepage = "https://gitee.com/eternalnight996"
categories = ["gui", "network-programming"]
description = "MII - Machine Internal Inspection"
documentation = "https://docs.rs"
keywords = ["gui", "e-", "heg"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
