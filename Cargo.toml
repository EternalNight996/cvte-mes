
[lib]
# 设置 crate 类型，有三个选项：`rlib` (Rust library)，`dylib` (dynamic library)，`cdylib` (C-compatible dynamic library)
crate-type = ["rlib"]
proc-macro = false

[features]
input-api = ["structopt"]
default = []

[dependencies]
strum = { version = "0.26", features = ["derive"] }
serde = "1"
serde_json = "1"
structopt = { version = "0.3", optional = true }
e-utils = { version = "0.4", features = [
  "cmd",
  "fs",
  "parse",
  "regex",
  "base64",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"

[dev-dependencies]
cvte-mes = { path = "./", features = ["input-api"] }
e-utils = { version = "0.4", features = ["cmd", "fs"] }
e-log = { version = "0.2", features = ["log"] }

[package]
name = "cvte-mes"
version = "0.1.0"
description = "源控MES系统接口"
authors = ["Eternal(梦游) <EternalNightYeah2@yeah.net>"]
edition = "2021"
rust-version = "1.80.0"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://gitee.com/eternalnight996"
categories = []
documentation = "https://docs.rs"
include = ["src/", "*.md", "LICENSE", "Cargo.toml", "COPYRIGHT"]
keywords = ["e-", "mes"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]
all-features = true
